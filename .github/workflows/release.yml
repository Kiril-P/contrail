name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Core tests
        working-directory: Packages/ContrailCore
        run: swift test

      - name: Build and package
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/build-release.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.dmg dist/SHA256SUMS.txt \
            --title "Contrail ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md
